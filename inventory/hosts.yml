---
all:
  children:
    proxmox:
      vars:
        ansible_user: root
      hosts:
        DC-A-PVE-11:
          ansible_host: 10.50.200.11
        DC-A-PVE-12:
          ansible_host: 10.50.200.12
        DC-A-PVE-13:
          ansible_host: 10.50.200.13

    # The node that holds template 9020 (and runs cluster-wide pvesh reads).
    pve_template:
      hosts:
        DC-A-PVE-11:

    # shard = the master/replica pair. A master and its replica never share a pve_node.
    # PROD VM IP pool is 10.50.200.91-99; .97-.99 are spare. (DEV uses .3-.10.)
    redis_cluster:
      hosts:
        redis-prod-01:
          ansible_host: 10.50.200.91
          ip: 10.50.200.91
          vmid: 291
          pve_node: DC-A-PVE-11
          role: master
          shard: A
        redis-prod-02:
          ansible_host: 10.50.200.92
          ip: 10.50.200.92
          vmid: 292
          pve_node: DC-A-PVE-12
          role: master
          shard: B
        redis-prod-03:
          ansible_host: 10.50.200.93
          ip: 10.50.200.93
          vmid: 293
          pve_node: DC-A-PVE-13
          role: master
          shard: C
        redis-prod-04:
          ansible_host: 10.50.200.94
          ip: 10.50.200.94
          vmid: 294
          pve_node: DC-A-PVE-11
          role: replica
          shard: C
        redis-prod-05:
          ansible_host: 10.50.200.95
          ip: 10.50.200.95
          vmid: 295
          pve_node: DC-A-PVE-12
          role: replica
          shard: A
        redis-prod-06:
          ansible_host: 10.50.200.96
          ip: 10.50.200.96
          vmid: 296
          pve_node: DC-A-PVE-13
          role: replica
          shard: B
