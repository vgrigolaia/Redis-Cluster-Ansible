---
all:
  children:
    proxmox:
      vars:
        ansible_user: root
      hosts:
        DC-A-PVE-11:
          ansible_host: 10.50.200.11
        DC-A-PVE-12:
          ansible_host: 10.50.200.12
        DC-A-PVE-13:
          ansible_host: 10.50.200.13

    # The node that holds template 9010 (and runs cluster-wide pvesh reads).
    pve_template:
      hosts:
        DC-A-PVE-11:

    # shard = the master/replica pair. A master and its replica never share a pve_node.
    # VM IP pool is 10.50.200.3-10; .9 and .10 are spare.
    redis_cluster:
      hosts:
        redis-dev-01:
          ansible_host: 10.50.200.3
          ip: 10.50.200.3
          vmid: 270
          pve_node: DC-A-PVE-11
          role: master
          shard: A
        redis-dev-02:
          ansible_host: 10.50.200.4
          ip: 10.50.200.4
          vmid: 271
          pve_node: DC-A-PVE-12
          role: master
          shard: B
        redis-dev-03:
          ansible_host: 10.50.200.5
          ip: 10.50.200.5
          vmid: 272
          pve_node: DC-A-PVE-13
          role: master
          shard: C
        redis-dev-04:
          ansible_host: 10.50.200.6
          ip: 10.50.200.6
          vmid: 273
          pve_node: DC-A-PVE-11
          role: replica
          shard: C
        redis-dev-05:
          ansible_host: 10.50.200.7
          ip: 10.50.200.7
          vmid: 274
          pve_node: DC-A-PVE-12
          role: replica
          shard: A
        redis-dev-06:
          ansible_host: 10.50.200.8
          ip: 10.50.200.8
          vmid: 275
          pve_node: DC-A-PVE-13
          role: replica
          shard: B
