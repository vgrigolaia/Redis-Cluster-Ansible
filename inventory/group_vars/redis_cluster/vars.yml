---
ansible_user: "{{ ci_user }}"
ansible_become: true
# Dev VMs get rebuilt with new host keys; don't pollute known_hosts.
# IdentityAgent=SSH_AUTH_SOCK: ~/.ssh/config's `Host *` points at the 1Password
# agent, which doesn't hold the VM key; use the ssh-agent from the shell instead.
ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentityAgent=SSH_AUTH_SOCK
